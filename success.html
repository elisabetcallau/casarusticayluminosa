<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva confirmada</title>
<style>
  body { font-family: Georgia, serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f0eb; }
  .box { text-align: center; padding: 3rem 2rem; background: white; border-radius: 12px; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .check { font-size: 4rem; margin-bottom: 1rem; }
  h1 { color: #5c4a2a; font-size: 1.8rem; margin-bottom: 1rem; }
  p { color: #666; line-height: 1.6; }
  a { display: inline-block; margin-top: 2rem; color: #5c4a2a; text-decoration: none; border: 1px solid #5c4a2a; padding: 0.75rem 1.5rem; border-radius: 6px; }
  a:hover { background: #5c4a2a; color: white; }
</style>
</head>
<body>
<div class="box">
  <div class="check">✓</div>
  <h1>¡Reserva confirmada!</h1>
  <p>Hemos recibido tu pago. Te enviaremos un email de confirmación con todos los detalles de tu estancia.</p>
  <p>¡Nos vemos en el Delta! 🌿</p>
  <a href="/">← Volver a la web</a>
</div>
</body>
</html>
